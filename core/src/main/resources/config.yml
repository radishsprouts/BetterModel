# BetterModel Configuration
#
# This file contains all the configuration options for the BetterModel plugin.
# For detailed information on each option, please refer to the official documentation.

# Debugging options for development and troubleshooting.
# Enable these only if you are diagnosing issues.
debug:
  # Toggles debug messages for hitbox creation and interaction.
  hitbox: false
  # Toggles detailed stack traces for exceptions handled by the plugin.
  exception: false
  # Toggles debug messages related to resource pack generation.
  pack: false
  # Toggles debug messages for model tracker lifecycle and updates.
  tracker: false

# Visual indicator settings.
indicator:
  # Shows a progress bar during resource pack generation.
  progress_bar: true

# Core feature modules.
# Disable modules you don't need to save resources.
module:
  # Enables general entity models.
  model: true
  # Enables player-specific animations and models (e.g., custom limbs).
  player-animation: true
  # Enables player armor in player model.
  player-armor: true

# Resource pack generation settings.
pack:
  # Obfuscates model and texture names in the resource pack to prevent easy extraction.
  use-obfuscation: true

# Toggles metrics collection via bStats (https://bstats.org/plugin/bukkit/BetterModel/24237).
# Disabling this helps us less to improve the plugin.
metrics: true

# Enables sight-trace culling: models are only rendered if there is a clear line of sight.
sight-trace: true

# Merges the generated resource pack with packs from other plugins.
merge-with-external-resources: true

# The base item used for custom model data.
# It's recommended to use an item that is not commonly used for other purposes.
item: leather_horse_armor

# Maximum distance (in blocks) for sending animation packets. -1 for default server view distance.
max-sight: -1
# Minimum distance (in blocks) before animation packets are sent.
min-sight: 5

# The namespace used for resource pack assets (e.g., assets/bettermodel/...).
namespace: "bettermodel"

# The format of the generated resource pack.
# 'zip': A standard .zip file.
# 'folder': A raw folder structure (useful for merging or debugging).
pack-type: zip

# The location where the resource pack file or folder will be generated, relative to the server root.
build-folder-location: BetterModel/build

# If enabled, models attached to invisible mobs will also be invisible.
follow-mob-invisibility: true

# If enabled, utilizes Purpur's AFK API to pause animations for AFK players.
use-purpur-afk: true

# Checks for new plugin versions on startup and notifies admins.
version-check: true

# The default movement controller for mountable models.
# 'walk': Standard ground-based movement.
# 'fly': Flying movement.
default-mount-controller: walk

# The time in ticks between inserted keyframes for smooth interpolation (lerp).
# Lower values result in smoother but potentially more resource-intensive animations.
lerp-frame-time: 3

# Prevents players from swapping hotbar slots if they have a custom player model or animation active.
cancel-player-model-inventory: false

# The delay in ticks before a player's original entity is hidden after a model is applied.
# This can help prevent visual glitches.
player-hide-delay: 3

# The number of packets to bundle together before sending.
# Higher values can reduce network overhead but may increase perceived latency. 0 to disable.
packet-bundling-size: 16

# モデルから遠いプレイヤーへ送るアニメーションパケットを減らします（LOD）。
# 飛ばしたフレームは失われず、次のパケットで飛ばした時間をかけて補間されます。
animation-lod: true

# パケットを減らし始める距離（ブロック）と、そこで何フレーム（1フレーム 25ms）を1回にまとめるか。
# 2 ならパケットが半分になります。
animation-lod-near-distance: 16
animation-lod-near-step: 2

# さらに減らす距離（ブロック）と、そこでの間引き幅。4 ならパケットが 1/4 になります。
animation-lod-far-distance: 32
animation-lod-far-step: 4

# Enables strict loading mode. If true, the plugin will fail to load models with unsupported features.
# If false, it will attempt to load them by ignoring unsupported parts, which may cause visual issues.
enable-strict-loading: false

# 統合版（Bedrock）向けの出力の設定。
# Velocity と Geyser を使うサーバーで、統合版のプレイヤーにもモデルを見せるために使います。
# 有効な間は、リロードのたびに output-folder へ統合版用のモデル・テクスチャ・目録（index.json）を書き出します。
# Geyser 側の拡張（KadoDisplayEntity）が、このフォルダを読んで登録します。
bedrock:
  # 統合版用の出力を作るか。
  enabled: true
  # 出力先のフォルダ名（plugins/BetterModel/ からの相対パス）。
  output-folder: bedrock

# リソースパックの配布の設定。
# BetterModel が作ったリソースパックを、Java 版のプレイヤーへサーバーから送ります。
# 送らないと、モデルが紫と黒の格子（テクスチャ無し）で見えます。統合版のプレイヤーには送りません。
# Nexo など別のプラグインがパックを配る場合（merge-with-external-resources が true で Nexo が入っている時）は、二重に送りません。
# pack-type が none の時は配りません。
resource-pack-host:
  # 配布するか。
  enabled: true
  # 配り方。
  # cloudflare（既定）: パックを作り終えるたびに、BetterModel 専用の Cloudflare Worker（Static Assets だけの Worker）へ
  #   プラグイン自身がアップロードし、その URL をプレイヤーへ渡します。node や wrangler は要りません（Linux でもこの jar と設定だけで動きます）。
  #   アップロードに失敗しても、self-host へは切り替えません（警告を出して、新しいパックは配りません）。
  # self-host: BetterModel が自分で HTTP サーバーを立てて、パックの ZIP を配ります。
  # url: 別の場所に置いた ZIP の URL（下の url）をプレイヤーへ渡します。
  mode: cloudflare
  # mode が cloudflare の時の設定。他のリソースパックの Worker とは別の、BetterModel 専用の Worker を使います。
  # （Static Assets は送ったファイルの一覧で版が丸ごと置き換わるため、他のパックと同じ Worker には置きません）
  cloudflare:
    # Cloudflare のアカウント ID。空なら環境変数 BETTERMODEL_CLOUDFLARE_ACCOUNT_ID を読みます。
    account-id: ""
    # Cloudflare の API トークン。空なら環境変数 BETTERMODEL_CLOUDFLARE_API_TOKEN を読みます（ログには出しません）。
    # 必要な権限:
    #   アカウントの「Workers Scripts Write」（ダッシュボードでは Workers Scripts: Edit）
    #   ゾーン kaiware.games の「Workers Routes Write」（ダッシュボードでは Workers Routes: Edit）
    api-token: ""
    # BetterModel 専用の Worker の名前。無ければ最初のアップロードで作られます。英小文字・数字・ハイフンだけ。
    worker-name: bettermodel-pack
    # BetterModel 専用のカスタムドメイン（必須）。Workers のカスタムドメインとして付け、この URL でパックを配ります。
    # - workers.dev は使いません（Worker の workers.dev と preview の URL は、アップロードのたびに無効にします）。
    #   空にすると、何もアップロードせず警告を出して、パックを配りません。
    # - ドメインのゾーン（kaiware.games）が、api-token と同じ Cloudflare アカウントにある必要があります。
    # - file-server のリソースパックの Worker が使っている resource.minecraft.kaiware.games は入れてはいけません。
    #   入れると、他のパックを配っている Worker からホスト名を奪うおそれがあるため、設定してもアップロードしません。
    # - すでに別の Worker が使っているホスト名や、DNS レコードがあるホスト名は上書きせず、警告を出して止まります。
    custom-domain: bettermodel.minecraft.kaiware.games
    # アップロードするパックのファイル名。この名前がそのまま URL のファイル名になります（https://<custom-domain>/<file-name>）。
    # 開発機と本番サーバーは同じ Worker・同じカスタムドメインを使うので、別の名前にしてください。
    # 例: 本番は BetterModel-ResourcePack.zip（既定）、開発機は BetterModel-ResourcePack-dev.zip
    # 自分の名前のファイルだけを差し替え、同じ Worker にある他の名前のファイルは残します。
    # 使える文字は英数字・-・_・. だけで、.zip で終わる名前にします（/ や .. は使えません）。
    # 不正な名前の時は、何もアップロードせず警告を出して、パックを配りません。
    file-name: BetterModel-ResourcePack.zip
    # Worker の compatibility_date。
    compatibility-date: "2025-09-01"
  # self-host で待ち受けるアドレスとポート。ポートが使えない時は、エラーを出して配布だけを止めます。
  bind-address: 0.0.0.0
  port: 8163
  # self-host で、プレイヤーへ渡す URL（http://サーバーのIPかドメイン:ポート/bettermodel.zip）。
  # 空なら server.properties の server-ip（空なら 127.0.0.1）とポートから作りますが、それでは外のプレイヤーには届きません。
  public-url: ""
  # url モードで、ZIP が置かれている URL。
  url: ""
  # 適用を尋ねる時の文。
  prompt: "このサーバーのモデルを表示するためのリソースパックです。適用してください。"
  # true にすると、適用しないとサーバーに入れません。
  required: false
  # self-host で同時に処理するリクエストの上限。
  max-connections: 16
